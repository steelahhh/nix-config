# soularr config TEMPLATE — copy to homeserver after deploying:
#   scp hosts/homeserver/soularr-config.ini homeserver:/var/lib/soularr/config.ini
# then fill the two api_key values via soularr's web UI config editor
# (http://homeserver:8265). Keys stay out of the repo.
# Lidarr API key: Lidarr -> Settings -> General -> Security.
# slskd API key: SLSKD_API_KEY from secrets/slskd-env.age.
# Paths are identical inside and outside the containers (repo convention):
# native Lidarr and slskd both see /srv/downloads/slskd.

[Lidarr]
host_url = http://homeserver:8686
api_key = REPLACE_WITH_LIDARR_API_KEY
download_dir = /srv/downloads/slskd
disable_sync = False

[Slskd]
host_url = http://homeserver:5030
api_key = REPLACE_WITH_SLSKD_API_KEY
url_base = /
download_dir = /srv/downloads/slskd
delete_searches = False
stalled_timeout = 3600

[Release Settings]
use_selected_lidarr_release = False
use_most_common_tracknum = True
allow_multi_disc = True
accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
skip_region_check = False
accepted_formats = CD,Digital Media,Vinyl

[Search Settings]
search_timeout = 5000
maximum_peer_queue = 50
minimum_peer_upload_speed = 0
minimum_filename_match_ratio = 0.8
minimum_search_interval = 5
search_retry_wait_hours = 0
allowed_filetypes = flac 24/192,flac 16/44.1,flac,mp3 320,mp3
ignored_users =
album_prepend_artist = False
search_type = incrementing_page
number_of_albums_to_grab = 10
title_blacklist =
search_blacklist =
search_source = missing
failed_import_denylist = True
ignore_failed_users = False
failed_user_ignore_hours = 168

[Download Settings]
download_filtering = True
use_extension_whitelist = False
extensions_whitelist = lrc,nfo,txt
rename_download_folders = True

[Logging]
level = INFO
format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
datefmt = %Y-%m-%dT%H:%M:%S%z
log_to_file = True
log_file = soularr.log
max_bytes = 1048576
backup_count = 3